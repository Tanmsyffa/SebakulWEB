<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEBAKUL sedang offline</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #FAF8F5;
      color: #181615;
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border: 1px solid #E6E1D8;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 1px 3px rgba(24, 22, 21, 0.06);
    }
    h1 {
      font-size: 22px;
      line-height: 1.3;
      margin: 0 0 8px;
      color: #181615;
    }
    p {
      font-size: 14px;
      line-height: 1.55;
      color: #57534E;
      margin: 0 0 20px;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      width: 100%;
      background: #0F766E;
      color: #FFFFFF;
      border: 0;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #115E59; }
    button:focus-visible { outline: 2px solid #0F766E; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>SEBAKUL sedang offline</h1>
    <p>Sambungkan perangkat ke internet untuk membuka data terbaru dan menyimpan transaksi. Data akun dan kas tidak disimpan secara lokal di perangkat ini.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF9F6">
  <title>SEBAKUL sedang offline</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #FAF9F6;
      color: #181715;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 20px;
      overscroll-behavior-y: none;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border: 1px solid #EAE6DF;
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(24, 23, 21, 0.04);
    }
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      margin: 0 auto 14px;
      display: block;
      object-fit: cover;
      background: #0F766E;
    }
    .brand {
      font-size: 12px;
      font-weight: 600;
      color: #0F766E;
      margin: 0 0 4px;
    }
    .jargon {
      font-size: 12px;
      color: #716C65;
      margin: 0 0 16px;
      font-style: italic;
    }
    h1 {
      font-size: 20px;
      line-height: 1.3;
      margin: 0 0 8px;
      color: #181715;
      font-weight: 600;
    }
    p {
      font-size: 14px;
      line-height: 1.55;
      color: #57534E;
      margin: 0 0 22px;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      width: 100%;
      background: #0F766E;
      color: #FFFFFF;
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #115E59; }
    button:focus-visible { outline: 2px solid #0F766E; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/images/sebakul-logo.png" alt="Logo SEBAKUL" width="56" height="56">
    <div class="brand">SEBAKUL · SEntra Beverages And KULiner</div>
    <div class="jargon">Gué Katé Jugé Apé... Di Sini Ajé...</div>
    <h1>Koneksi internet terputus</h1>
    <p>Sambungkan perangkat ke internet untuk membuka data terbaru dan menyimpan transaksi. Data akun dan kas tidak disimpan secara lokal di perangkat ini.</p>
    <button type="button" onclick="location.reload()">Coba muat ulang</button>
  </main>
</body>
</html>
